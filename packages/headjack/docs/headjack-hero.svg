<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
  <title id="t">headjack</title>
  <desc id="d">An engraved study of the back of a head with a socket at the base of the skull. A glowing cable carries skill files up into the socket.</desc>
  <defs>
    <linearGradient id="cable" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1F6B48"/>
      <stop offset="1" stop-color="#4FE39A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8A9BB0" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <clipPath id="headClip">
      <path d="M300 70 C 390 70 448 140 452 225 C 455 290 432 330 410 352 C 398 365 392 380 392 400 L 392 480 L 208 480 L 208 400 C 208 380 202 365 190 352 C 168 330 145 290 148 225 C 152 140 210 70 300 70 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="480" fill="#161B22"/>

  <!-- plate frame -->
  <rect x="24" y="24" width="1152" height="432" fill="none" stroke="#2C3542" stroke-width="1"/>
  <text x="1156" y="444" text-anchor="end" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="13" fill="#5E6B7C">Plate I. The posterior port, with a skill in transit.</text>

  <!-- head, engraved: hatched shadow + contour lines -->
  <g clip-path="url(#headClip)">
    <rect x="140" y="60" width="320" height="420" fill="#1B222C"/>
    <rect x="300" y="60" width="170" height="420" fill="url(#hatch)"/>
    <g fill="none" stroke="#8A9BB0" stroke-width="0.8" opacity="0.55">
      <path d="M205 120 C 260 100 340 100 395 120"/>
      <path d="M180 160 C 250 140 350 140 420 160"/>
      <path d="M165 205 C 245 188 355 188 435 205"/>
      <path d="M160 250 C 245 236 355 236 440 250"/>
      <path d="M170 295 C 245 284 355 284 430 295"/>
      <path d="M300 72 C 296 160 296 250 300 330"/>
      <path d="M250 82 C 236 170 236 250 248 330"/>
      <path d="M350 82 C 364 170 364 250 352 330"/>
    </g>
  </g>
  <path d="M300 70 C 390 70 448 140 452 225 C 455 290 432 330 410 352 C 398 365 392 380 392 400 L 392 480 M208 480 L 208 400 C 208 380 202 365 190 352 C 168 330 145 290 148 225 C 152 140 210 70 300 70"
        fill="none" stroke="#C7D3E0" stroke-width="1.6"/>
  <!-- ears -->
  <path d="M150 210 C 132 214 128 250 140 268 C 146 276 152 276 156 270" fill="none" stroke="#C7D3E0" stroke-width="1.4"/>
  <path d="M450 210 C 468 214 472 250 460 268 C 454 276 448 276 444 270" fill="none" stroke="#C7D3E0" stroke-width="1.4"/>

  <!-- the port, base of the skull -->
  <g transform="translate(300 338)">
    <ellipse rx="26" ry="20" fill="#0E1319" stroke="#B8C2CC" stroke-width="2"/>
    <ellipse rx="17" ry="12" fill="#0A0E12" stroke="#B8C2CC" stroke-width="1"/>
    <g stroke="#B8C2CC" stroke-width="1">
      <line x1="-21" y1="0" x2="-31" y2="0"/><line x1="21" y1="0" x2="31" y2="0"/>
      <line x1="0" y1="-16" x2="0" y2="-24"/>
    </g>
    <circle r="4" fill="#4FE39A" filter="url(#glow)"/>
  </g>
  <!-- dimension callout -->
  <g stroke="#5E6B7C" stroke-width="0.8" fill="none">
    <line x1="274" y1="372" x2="274" y2="392"/><line x1="326" y1="372" x2="326" y2="392"/>
    <line x1="274" y1="386" x2="326" y2="386"/>
    <line x1="272" y1="342" x2="150" y2="398"/><line x1="150" y1="398" x2="44" y2="398"/>
  </g>
  <text x="44" y="418" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="13" fill="#8A9BB0">port, occipital.</text>
  <text x="44" y="436" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="13" fill="#8A9BB0">accepts one skill at a time.</text>

  <!-- the cable: the one bright thing -->
  <path id="cablePath" d="M300 358 C 300 430 380 452 500 452 C 700 452 760 340 860 262" fill="none" stroke="#0E1319" stroke-width="16" stroke-linecap="round"/>
  <path d="M300 358 C 300 430 380 452 500 452 C 700 452 760 340 860 262" fill="none" stroke="url(#cable)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- data in the cable -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="10" fill="#0B2A1B">
    <text><textPath href="#cablePath" startOffset="22%">01 SKILL 10 load 0110 conventions 1001 checklist 01</textPath></text>
  </g>

  <!-- skill cards in transit along the cable -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12">
    <g transform="translate(560 447) rotate(-5)">
      <rect x="-82" y="-15" width="164" height="30" rx="2" fill="#13261D" stroke="#4FE39A" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#B9F5D3">json-canvas/SKILL.md</text>
    </g>
    <g transform="translate(790 330) rotate(-38)" opacity="0.6">
      <rect x="-94" y="-15" width="188" height="30" rx="2" fill="#13261D" stroke="#4FE39A" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#B9F5D3">release-notes/SKILL.md</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="1140" y="148" text-anchor="end" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="96" fill="#E6EDF3" letter-spacing="-2">headjack</text>
  <line x1="820" y1="172" x2="1140" y2="172" stroke="#2C3542" stroke-width="1"/>
  <text x="1140" y="206" text-anchor="end" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" fill="#C7D3E0">Skills, loaded the moment you need them.</text>
  <text x="1140" y="238" text-anchor="end" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="17" fill="#5E6B7C">“I know kung fu.”</text>
</svg>
