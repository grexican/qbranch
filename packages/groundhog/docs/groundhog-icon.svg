<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="groundhog">
  <rect width="128" height="128" rx="24" fill="#1A2440"/>
  <!-- first light on the horizon -->
  <rect x="0" y="92" width="128" height="36" rx="0" fill="#E9874A" opacity="0.18"/>
  <path d="M0 100 Q 64 86 128 100 L128 104 L0 104 Z" fill="#E9874A" opacity="0.35"/>
  <!-- flip clock body -->
  <rect x="18" y="30" width="92" height="56" rx="9" fill="#0F1629" stroke="#33416B" stroke-width="2"/>
  <!-- two flip cards -->
  <rect x="25" y="37" width="36" height="42" rx="5" fill="#222E52"/>
  <rect x="67" y="37" width="36" height="42" rx="5" fill="#222E52"/>
  <line x1="25" y1="58" x2="61" y2="58" stroke="#0F1629" stroke-width="2"/>
  <line x1="67" y1="58" x2="103" y2="58" stroke="#0F1629" stroke-width="2"/>
  <text x="43" y="71" text-anchor="middle" font-family="'Bahnschrift', 'DIN Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="30" fill="#F4E9DA">6</text>
  <text x="85" y="71" text-anchor="middle" font-family="'Bahnschrift', 'DIN Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="30" fill="#F4E9DA">00</text>
  <circle cx="64" cy="50" r="2" fill="#E9874A"/>
  <circle cx="64" cy="66" r="2" fill="#E9874A"/>
  <!-- the loop -->
  <path d="M30 22 A 40 40 0 0 1 98 22" fill="none" stroke="#E9874A" stroke-width="3" stroke-linecap="round"/>
  <path d="M98 22 l-7 -3 l1 7 Z" fill="#E9874A"/>
</svg>
