name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --omit=optional
      - run: npm test
        env: { HEADJACK_EMBED: '0', UB_EMBED: '0' }
      - name: generated files are in sync with packages/
        run: npm run sync:check

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: belt-linux-x64 }
          - { os: ubuntu-24.04-arm, name: belt-linux-arm64 }
          - { os: macos-latest, name: belt-macos-arm64 }
          - { os: macos-13, name: belt-macos-x64 }
          - { os: windows-latest, name: belt-windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: npm ci --omit=optional
      - run: node scripts/build-binary.mjs
      - name: smoke
        shell: bash
        run: |
          B=build/${{ matrix.name }}/belt; [ -f "$B.exe" ] && B="$B.exe"
          "$B" version
          "$B" moneyball | head -1
          P=$(mktemp -d); "$B" install all --platform claude --project "$P"; test -f "$P/.claude/settings.json"
      - name: archive
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ${{ matrix.name }}.zip ${{ matrix.name }}; else tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}; fi
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: 'build/${{ matrix.name }}.*' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }

  # Publish each packages/<tool> to its own read-only repo (grexican/<tool>), history included.
  # One write-scoped deploy key per mirror, stored as secret MIRROR_KEY_<TOOL>.
  mirror:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        tool: [headjack, middleout, moneyball, groundhog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: split and push
        env:
          KEY: ${{ secrets[format('MIRROR_KEY_{0}', matrix.tool)] }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          git subtree split --prefix=packages/${{ matrix.tool }} -b mirror
          GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o StrictHostKeyChecking=accept-new" \
            git push --force git@github.com:${{ github.repository_owner }}/${{ matrix.tool }}.git mirror:main
