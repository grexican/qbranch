name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --omit=optional
      - run: npm test
        env: { HEADJACK_EMBED: '0', QB_EMBED: '0' }
      - name: generated files are in sync with packages/
        run: npm run sync:check

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: qbranch-linux-x64 }
          - { os: ubuntu-24.04-arm, name: qbranch-linux-arm64 }
          - { os: macos-latest, name: qbranch-macos-arm64 }
          - { os: macos-13, name: qbranch-macos-x64 }
          - { os: windows-latest, name: qbranch-windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: npm ci --omit=optional
      - run: node scripts/build-binary.mjs
      - name: smoke
        shell: bash
        run: |
          B=build/${{ matrix.name }}/qbranch; [ -f "$B.exe" ] && B="$B.exe"
          "$B" version
          "$B" moneyball | head -1
          P=$(mktemp -d); "$B" install all --platform claude --project "$P"; test -f "$P/.claude/settings.json"
      - name: archive
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ${{ matrix.name }}.zip ${{ matrix.name }}; else tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}; fi
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: 'build/${{ matrix.name }}.*' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }

